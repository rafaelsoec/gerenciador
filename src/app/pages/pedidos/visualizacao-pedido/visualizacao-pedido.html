<section class="container-fluid pagina cadastro-pedido-pagina">

  <!-- Corpo com scroll -->
  <div class="cp-corpo">

    <div id="visualizacao-pedido">
      <div class="row g-3">

        <!-- Cliente -->
        <div class="col-12">
          <app-select-autocomplete
            label="Cliente"
            [obrigatorio]="true"
            placeholder="Cliente do pedido"
            mode="single"
            [disabled]="true"
            [options]="clientes()"
            [ngModel]="clienteIdSignal()"
            [ngModelOptions]="{ name: 'clienteId' }">
          </app-select-autocomplete>
        </div>

        <!-- Valor -->
        <div class="col-12 col-sm-6">
          <mat-form-field appearance="outline" class="campo-full">
            <mat-label>Valor (R$)</mat-label>
            <input
              matInput
              disabled
              [value]="valorCalculado()" />
          </mat-form-field>
        </div>

        <!-- Forma de Pagamento -->
        <div class="col-12 col-sm-6">
          <mat-form-field appearance="outline" class="campo-full">
            <mat-label>Forma de Pagamento</mat-label>
            <mat-select
              disabled
              [value]="formaPagamentoSignal()">

              @for (opcao of formasPagamento; track opcao.value) {
                <mat-option [value]="opcao.value">
                  {{ opcao.label }}
                </mat-option>
              }

            </mat-select>
          </mat-form-field>
        </div>

        <!-- Desconto -->
        <div class="col-12 col-sm-4">
          <mat-form-field appearance="outline" class="campo-full">
            <mat-label>Desconto (R$)</mat-label>
            <input
              matInput
              disabled
              [value]="form.desconto" />
          </mat-form-field>
        </div>

        <!-- Frete -->
        <div class="col-12 col-sm-4">
          <mat-form-field appearance="outline" class="campo-full">
            <mat-label>Frete (R$)</mat-label>
            <input
              matInput
              disabled
              [value]="form.frete" />
          </mat-form-field>
        </div>

        <!-- Data de Entrega -->
        <div class="col-12 col-sm-4">
          <mat-form-field appearance="outline" class="campo-full">
            <mat-label>Data de Entrega</mat-label>
            <input
              matInput
              disabled
              [matDatepicker]="picker"
              [value]="dataEntregaSignal()" />

            <mat-datepicker-toggle
              matIconSuffix
              [for]="picker"
              disabled>
            </mat-datepicker-toggle>

            <mat-datepicker
              #picker
              disabled>
            </mat-datepicker>
          </mat-form-field>
        </div>

        <!-- Observação -->
        <div class="col-12">
          <mat-form-field appearance="outline" class="campo-full">
            <mat-label>Observação</mat-label>
            <textarea
              matInput
              disabled
              [value]="form.observacao">
            </textarea>
          </mat-form-field>
        </div>

        <!-- Itens do Pedido -->
        <div class="col-12">
          <p class="secao-label">Itens do Pedido</p>

          <app-itens-pedido
            [itens]="itensPedido()"
            [disabled]="true">
          </app-itens-pedido>
        </div>

      </div>
    </div>

  </div>

  <!-- Footer fixo -->
  <div class="cp-footer">

    <button
      matButton="outlined"
      type="button"
      (click)="onCancelar()">

      <mat-icon fontIcon="arrow_back"></mat-icon>
      Voltar
    </button>

  </div>

</section>
