<!-- Linha de entrada -->
<div *ngIf="!disabled()" class="itens-entrada row g-2 align-items-start">

  <div class="col-12 col-sm-7">
    <app-select-autocomplete
      *ngIf="produtos().length > 0"
      label="Produto"
      [obrigatorio]="true"
      placeholder="Digite para buscar..."
      mode="single"
      [options]="produtosDisponiveis()"
      [(ngModel)]="entrada.produtoId"
      [ngModelOptions]="{ name: 'produtoId' }">
    </app-select-autocomplete>
  </div>

  <div class="col-8 col-sm-4">
    <mat-form-field class="w-100" appearance="outline">
      <mat-label>Quantidade</mat-label>
      <input
        matInput
        type="number"
        min="1"
        name="quantidade"
        [(ngModel)]="entrada.quantidade" />
    </mat-form-field>
  </div>

  <div class="col-4 col-sm-1 d-flex align-items-center justify-content-center pt-1">
    <button mat-icon-button type="button" class="btn-adicionar-icon" (click)="adicionarItem()">
      <mat-icon>add_circle</mat-icon>
    </button>
  </div>

</div>

<!-- Tabela de itens adicionados -->
@if (itensDaTabela().length > 0) {
  <table class="itens-tabela">
    <colgroup>
      <col style="width: 60%">
      <col style="width: 30%">
      <col style="width: 10%">
    </colgroup>

    <thead>
    <tr>
      <th>Produto</th>
      <th>Quantidade</th>
      <th></th>
    </tr>
    </thead>

    <tbody>
      @for (item of itensDaTabela(); track item.produtoId) {
        <tr>
          <td class="col-produto">
            {{ item.produtoNome }}
          </td>

          @if (item.editando) {
            <td class="col-qtd">
              <mat-form-field
                class="campo-qtd-edicao"
                appearance="fill"
                subscriptSizing="dynamic">

                <input
                  matInput
                  type="number"
                  min="1"
                  [(ngModel)]="item.quantidadeEdicao"
                  [ngModelOptions]="{
                    name: 'qtd_' + item.produtoId
                  }" />
              </mat-form-field>
            </td>

            <td class="col-acoes">
              <button
                mat-icon-button
                type="button"
                class="btn-confirmar"
                (click)="confirmarEdicao(item)">
                <mat-icon>check</mat-icon>
              </button>

              <button
                mat-icon-button
                type="button"
                class="btn-cancelar-edicao"
                (click)="cancelarEdicao(item)">
                <mat-icon>close</mat-icon>
              </button>
            </td>

          } @else {
            <td class="col-qtd">
              {{ item.quantidade }}
            </td>

            <td class="col-acoes">
              <button
                mat-icon-button
                type="button"
                class="btn-editar"
                (click)="iniciarEdicao(item)">
                <mat-icon>edit</mat-icon>
              </button>

              <button
                mat-icon-button
                type="button"
                class="btn-remover"
                *ngIf="!disabled()"
                (click)="removerItem(item)">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          }
        </tr>
      }
    </tbody>
  </table>
}
