<div class="container-fluid" [style]="id ? 'margin-left: 15px; margin-right: 15px;' : ''">

  <!-- Header fixo -->
  <app-header-pagina [titulo]="id ? 'Editar Pedido' : 'Novo Pedido'"
    [subtitulo]="id ? 'Atualize os dados do pedido' : 'Preencha os dados do pedido'" [enableContent]="true"
    corBackground="#173B5E" corTexto="#ffffff">
    <h3>Total: R$ {{valorCalculado()}}</h3>
  </app-header-pagina>

  <!-- Corpo com scroll -->
  <app-scroll [vertical]="true" [horizontal]="false" [scrollbarOffset]="10">
    <form *ngIf="form" id="form-cadastro-pedido" (ngSubmit)="onSalvar()" novalidate>

      <!-- ==== SECAO: DADOS DO PEDIDO ==== -->
      <div class="en-secao">
        <h3 class="en-secao-titulo">Dados do Pedido</h3>
        <div class="row g-3">

          <!-- Cliente -->
          <div class="col-12">
            <app-select-autocomplete label="Cliente" [obrigatorio]="true" placeholder="Digite para buscar..."
              mode="single" [disabled]="disabled()" [options]="clientes()" [ngModel]="clienteIdSignal()"
              (ngModelChange)="clienteIdSignal.set($event)" [ngModelOptions]="{ name: 'clienteId' }">
            </app-select-autocomplete>
          </div>

          <!-- Valor -->
          <!-- <div class="col-12 col-sm-6">
            <mat-form-field appearance="outline" class="campo-full">
              <mat-label>Valor (R$) *</mat-label>
              <input
                matInput
                disabled
                [value]="valorCalculado()"
                tabindex="-1"
                style="pointer-events: none; caret-color: transparent;" />
            </mat-form-field>
          </div> -->

          <!-- Forma de Pagamento -->
          <div class="col-12 col-sm-3">
            <mat-form-field appearance="outline" class="campo-full">
              <mat-label>Forma de Pagamento *</mat-label>
              <mat-select name="formaPagamento" [disabled]="disabled()" [ngModel]="formaPagamentoSignal()"
                (ngModelChange)="formaPagamentoSignal.set($event)">
                @for (opcao of formasPagamento; track opcao.value) {
                <mat-option [value]="opcao.value">{{ opcao.label }}</mat-option>
                }
              </mat-select>
            </mat-form-field>
          </div>

          <!-- Desconto -->
          <div class="col-12 col-sm-3">
            <app-moeda label="Desconto" name="desconto" [(ngModel)]="form.desconto" [disabled]="disabled()" />
          </div>

          <!-- Frete -->
          <div class="col-12 col-sm-3">
            <app-moeda label="Frete" name="frete" [(ngModel)]="form.frete" [disabled]="disabled()" />
          </div>

          <!-- Data de Entrega -->
          <div class="col-12 col-sm-3">
            <app-data label="Data de Entrega *" name="dataEntrega" [(ngModel)]="dataEntregaSignal"
              [disabled]="disabled()"></app-data>
          </div>

          <!-- Observação -->
          <div class="col-12">
            <mat-form-field appearance="outline" class="campo-full">
              <mat-label>Observação</mat-label>
              <textarea matInput name="observacao" [disabled]="disabled()" [(ngModel)]="form.observacao"></textarea>
            </mat-form-field>
          </div>

        </div>
      </div>

      <!-- ==== SECAO: ITENS ==== -->
      <div class="en-secao">
        <h3 class="en-secao-titulo">Itens do Pedido</h3>
        <app-itens-pedido [(itens)]="itensPedido" [disabled]="disabled()" (selectionChange)="onItensAlterados($event)"
          (totalAlterado)="onTotalAlterado($event)">
        </app-itens-pedido>
      </div>

    </form>
  </app-scroll>

  <!-- Footer fixo -->
  <app-footer background="#173B5E">
    <div class="d-flex justify-content-end align-items-center gap-2 w-100">

      <button matButton="outlined" type="button" (click)="onCancelar()">
        <mat-icon fontIcon="close"></mat-icon>
        Cancelar
      </button>

      <button matButton="filled" type="submit" form="form-cadastro-pedido" [disabled]="disabled() || invalido()">
        <mat-icon fontIcon="save"></mat-icon>
        {{ id ? 'Salvar Alterações' : 'Salvar Pedido' }}
      </button>

    </div>
  </app-footer>

</div>
