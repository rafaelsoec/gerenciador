<section class="container-fluid pagina">

  <app-header-pagina
    titulo="Notas Fiscais"
    subtitulo="Gerencie as notas fiscais emitidas"
    nomeBotao="Gerar Nota Fiscal"
    corBackground="#173B5E"
    corTexto="#ffffff"
    corBotao="#3b82f6"
    (botaoClicado)="onNovo()" />

  <div class="col-12">
    <app-tabela
      [dados]="notas()"
      [colunas]="colunas"
      corHeader="#173B5E"
      corTextoHeader="#ffffff"
      [exibirEdicao]="false"
      [icones]="icones"
      [exibirExclusao]="true"
      [paginacaoExterna]="true"
      [totalElementos]="totalElementos()"
      [itensPorPagina]="tamanhoPagina()"
      (excluir)="onExcluir($event)"
      (paginaAlterada)="onPaginaAlterada($event)" />
  </div>

</section>
