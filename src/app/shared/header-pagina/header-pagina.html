<header class="header-pagina d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
  <div class="cabecalho-texto">
    <h3>{{ titulo() }}</h3>
    @if (subtitulo()) {
    <p>{{ subtitulo() }}</p>
    }
  </div>

  @if (nomeBotao()) {
  <button matButton="filled" type="button" class="botao-acao" (click)="onBotaoClicado()">
    <mat-icon aria-hidden="false" aria-label="Example home icon" fontIcon="add"></mat-icon>
    {{ nomeBotao() }}
  </button>
  }
</header>
