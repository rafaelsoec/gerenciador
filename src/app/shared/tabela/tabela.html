<div class="tabela-wrapper">

  <table mat-table [dataSource]="dadosPagina()" class="tabela-mat">

    <!-- Colunas de dados: texto normal ou input quando a linha está em edição -->
    @for (col of colunas(); track col.campo) {
    <ng-container [matColumnDef]="col.campo">
      <th mat-header-cell *matHeaderCellDef>{{ col.header }}</th>
      <td mat-cell *matCellDef="let row">
        @if (estaEditando(row)) {
          <input
            class="input-edicao"
            [disabled]="!col.editavel"
            [value]="_rascunho()[col.campo]"
            (input)="atualizarRascunho(col.campo, $any($event.target).value)"
            (click)="$event.stopPropagation()"
          />
        } @else {
          {{ row[col.campo] }}
        }
      </td>
    </ng-container>
    }

    <!-- Coluna de ações -->
    @if (exibirAcoes()) {
    <ng-container matColumnDef="acoes">
      <th mat-header-cell *matHeaderCellDef class="acoes-header">Ações</th>
      <td mat-cell *matCellDef="let row" class="acoes-cell">

        @if (estaEditando(row)) {
          <!-- Modo edição: confirmar ou cancelar -->
          <button mat-icon-button matTooltip="Salvar" class="btn-salvar" (click)="confirmarEdicao(row)">
            <mat-icon>check</mat-icon>
          </button>
          <button mat-icon-button matTooltip="Cancelar" (click)="cancelarEdicao()">
            <mat-icon>close</mat-icon>
          </button>
        } @else {
          <!-- Modo normal: editar e/ou excluir -->
          @if (exibirEdicao()) {
            <button mat-icon-button matTooltip="Editar" (click)="iniciarEdicao(row)">
              <mat-icon>edit</mat-icon>
            </button>
          }
          @if (exibirExclusao()) {
            <button mat-icon-button matTooltip="Excluir" class="btn-excluir" (click)="excluir.emit(row)">
              <mat-icon>delete</mat-icon>
            </button>
          }
        }

      </td>
    </ng-container>
    }

    <tr mat-header-row *matHeaderRowDef="campos"></tr>
    <tr mat-row *matRowDef="let row; columns: campos;"></tr>

    <!-- Linha exibida quando não há dados -->
    <tr class="mat-row" *matNoDataRow>
      <td class="sem-dados" [attr.colspan]="campos.length">
        Nenhum registro encontrado.
      </td>
    </tr>

  </table>

  <app-paginador
    [length]="dados().length"
    [pageSize]="itensPorPagina()"
    [pageIndex]="_pageIndex()"
    [pageSizeOptions]="opcoesPagina()"
    (paginaAlterada)="onPaginaAlterada($event)">
  </app-paginador>
</div>
