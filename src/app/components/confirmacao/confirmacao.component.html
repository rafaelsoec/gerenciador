<div class="bg-white">
  <h2 mat-dialog-title>{{ data.titulo }}</h2>
  <mat-dialog-content>
    {{ data.mensagem }}
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button mat-dialog-close="false" style="border: 1px solid black;" >
      <span class="text-black ">Cancelar</span>
    </button>

    <button mat-flat-button color="warn" [mat-dialog-close]="true">
      Confirmar
    </button>
  </mat-dialog-actions>
</div>
