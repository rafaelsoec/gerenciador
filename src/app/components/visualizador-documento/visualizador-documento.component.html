<div class="visualizador">

  @if (urlSegura) {

  <div class="toolbar d-flex justify-content-between">
    <div>
      <!-- Destinatário: -->
    </div>

    <div class="d-flex justify-content-center">
      <!-- <div class="col text-white">
        <app-select-autocomplete label="Destinatário" [obrigatorio]="true" placeholder="Digite para buscar..." mode="single"
          [options]="clientes()" [somenteBordaInferior]="true" [ngModel]="clienteIdSignal()"
          (ngModelChange)="clienteIdSignal.set($event)" [ngModelOptions]="{ name: 'clienteId' }">
        </app-select-autocomplete>
      </div>
      <div class="col-2">
        <button mat-icon-button matTooltip="Enviar e-mail" (click)="enviarEmail()">
          <mat-icon class="text-white" fontIcon="send">Enviar E-mail</mat-icon>
        </button>
      </div> -->
    </div>

    <div>
      <button *ngIf="email" mat-icon-button matTooltip="Enviar e-mail" (click)="enviarEmail()">
        <mat-icon class="text-white" fontIcon="forward_to_inbox">Enviar E-mail</mat-icon>
      </button>
      <button mat-icon-button matTooltip="Imprimir PDF" (click)="imprimir()">
        <mat-icon class="text-white" fontIcon="print"></mat-icon>
      </button>

      <button mat-icon-button matTooltip="Baixar PDF" (click)="baixar()">
        <mat-icon class="text-white" fontIcon="download"></mat-icon>
      </button>

      <button mat-icon-button matTooltip="Fechar" (click)="fechar()">
        <mat-icon class="text-white" fontIcon="close"></mat-icon>
      </button>

    </div>

  </div>

  <div class="documento-container">
    <iframe #iframePdf class="documento" [src]="urlSegura" title="Visualizador de PDF">
    </iframe>
  </div>

  } @else {

  <div class="documento-vazio">
    <mat-icon fontIcon="picture_as_pdf"></mat-icon>
    <span>Nenhum documento disponível</span>
  </div>

  }

</div>
